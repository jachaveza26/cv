name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, test, validate, PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Validate HTML
        run: npm run validate:html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDF
        run: npm run pdf

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --accept 200,206,403,429,999 --exclude 'andres\.streamlite\.ca' dist/index.html
          fail: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Andres-Chavez-CV
          path: dist/Andres-Chavez-CV.pdf
